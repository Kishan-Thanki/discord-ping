name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        run: |
          mkdir -p dist
          build_flags=(-trimpath '-ldflags=-s -w')
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build "${build_flags[@]}" -o dist/discord-ping-linux-amd64 ./cmd/discord-ping
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build "${build_flags[@]}" -o dist/discord-ping-darwin-amd64 ./cmd/discord-ping
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build "${build_flags[@]}" -o dist/discord-ping-darwin-arm64 ./cmd/discord-ping
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build "${build_flags[@]}" -o dist/discord-ping-windows-amd64.exe ./cmd/discord-ping

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: discord-ping-${{ github.ref_name }}
          path: dist/discord-ping-*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: discord-ping-${{ github.ref_name }}
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/discord-ping-*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
