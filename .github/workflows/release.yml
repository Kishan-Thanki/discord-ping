name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/discord-ping-linux-amd64 ./cmd/discord-ping
          GOOS=darwin GOARCH=amd64 go build -o dist/discord-ping-darwin-amd64 ./cmd/discord-ping
          GOOS=darwin GOARCH=arm64 go build -o dist/discord-ping-darwin-arm64 ./cmd/discord-ping
          GOOS=windows GOARCH=amd64 go build -o dist/discord-ping-windows-amd64.exe ./cmd/discord-ping

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
